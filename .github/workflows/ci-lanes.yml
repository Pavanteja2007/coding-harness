# The six labelled CI lanes — T5.W1.3.
#
# WHY A NEW FILE
# --------------
# `.github/AGENTS.md` records the convention that each terminal owns one
# workflow file, and that convention is kept: harness-ci.yml, execution-ci.yml,
# memory-cli-ci.yml, ci.yml and windows-dockerfree-ci.yml all still exist and
# still own their module's test selection. What was missing is a LABELLED
# LANE INDEX — a place where "what blocks a merge, what needs Docker, and how
# long each lane may take" is stated once and mechanically checked.
#
# So `evals/ci_lanes.py` is that authority (six lanes, as data) and this file
# is its implementation. `tests/test_ci_lanes.py` fails when the two disagree:
# a lane that grows a seventh name, gets renamed, or acquires a Docker
# dependency breaks a test instead of quietly becoming a different gate.
#
#     python -m evals.ci_lanes            # human table, exit 2 on disagreement
#     python -m evals.ci_lanes --json
#
# THE ONE RULE EVERY LANE OBEYS
# ------------------------------
# Every job's FIRST step is `python -m tests.known_failing_pins`, and its exit
# code is the job's. It runs before any test collection so a PROMOTED pin
# fails the lane in seconds. The registry catches four distinct outcomes and
# three of them are build failures:
#
#   * a known-failing pin that now PASSES  -> PROMOTE. The gap closed. The
#     registry entry must be deleted in the same change, so the closure is
#     visible in the diff. This is the mechanism that stops a recorded gap
#     from silently rotting.
#   * a known-failing pin that is RED FOR A DIFFERENT REASON -> CHANGED
#     REASON. That is a real regression wearing the pin's name, and it is the
#     outcome most dangerous to file as a known gap.
#   * a known-failing pin that cannot be RUN -> MISSING / NOT_COLLECTED /
#     TIMED_OUT. A registry entry that cannot be observed is not a recording.
#   * a deliberately-GREEN inverted pin that goes red -> REGRESSION.
#
# No lane may consult the registry selectively. A registry some lanes read and
# others ignore is a registry whose promoted pins are promoted in one job and
# invisible in five.

name: ci-lanes

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- smoke --
  # <1 min. Mechanism assertions only. Blocking. No Docker, no network.
  # The lint ratchet is here because it is a mechanism assertion about a
  # committed baseline, not a style opinion.
  smoke:
    name: "smoke"
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: "GATE 1/7: known-failing pin registry"
        run: python -m tests.known_failing_pins

      - name: "GATE 2/7: the lane index agrees with the workflows"
        run: python -m evals.ci_lanes

      - name: Provenance (declared vendored code and binaries)
        run: python scripts/provenance_report.py

      # EVERY entry here is a MECHANISM assertion: fast (the whole lane is
      # under its 1-minute budget), deterministic, host-independent, and it
      # fails when a structural property breaks rather than when a machine is
      # busy. A timing assertion does NOT belong in this lane -- see
      # `host-only` for where they go and why.
      #
      # P1/W2 promotions, and what each one catches:
      #   cli/test_inert_surface_pin.py    an inert (never-rendered) surface that
      #                                    grew a real implementation
      #   cli/test_render_path_pin.py      a render path that stopped being the
      #                                    one the product renders through
      #   tests/test_skip_authority.py     a NEW skip-set table appearing, or a
      #                                    recorded one silently disappearing
      #   tests/test_config_defaults_match_source.py
      #                                    a stale __pycache__ serving a value
      #                                    the source does not declare. This one
      #                                    is here because it CAUGHT one: it
      #                                    served the pre-Phase-1 turn ceiling
      #                                    (25) for a whole session while the
      #                                    source said 60.
      - name: Cheap mechanism pins
        run: |
          python -m pytest -q -p no:randomly --no-header \
            tests/test_import_smoke.py \
            tests/test_trust_ladder.py \
            tests/test_provenance_report.py \
            tests/test_provenance_binaries.py \
            tests/test_known_failing_pins.py \
            tests/test_ci_lanes.py \
            tests/test_skip_authority.py \
            tests/test_config_defaults_match_source.py \
            tests/test_p2w1_untrusted_sources.py \
            tests/test_p2w1_policy_language.py \
            cli/test_sanitize_pipeline.py \
            cli/test_sanitize_shapes.py \
            cli/test_display_contract.py \
            cli/test_inert_surface_pin.py \
            cli/test_render_path_pin.py

      # P3a/W1-T5. The MEMORY TRUST BOUNDARY, and it is here for the same
      # reason the P2/W1 untrusted-source files are: a boundary checked only in
      # a 15-minute non-blocking lane is a boundary that is not checked on most
      # merges. These four are the memory layer's security surface --
      # `unavailable` is not an empty result set (the search-engine honesty
      # crux), the frozen snapshot's prompt-cache digest is measured against
      # `runtime.prompt_cache`, nothing is persisted until a human applies it,
      # and revocation is immediate and complete. Measured on the authoring
      # host: 2.51 + 1.74 + 2.76 + 4.33 = 11.3 s, deterministic, Docker-free and
      # network-free, with no timing or p95 assertion anywhere.
      #
      # `test_p3a_pipeline.py` (17.1 s) and `test_p3a_memory_ablation.py`
      # (5.6 s) are in `host-only` instead: they are slower, and the pipeline
      # suite builds 1,200-row corpora to reach its bounds.

      # P2/W1-T5. The executable form of the policy + untrusted-source
      # evidence, and its own gate rather than another line in the pytest step
      # above because it EXITS 2 on a regression: every shipped rule's `match`
      # / `not_match` examples are re-proved, the 167-entry arity table is
      # loaded, all seven untrusted sources are screened, the delimiter-breakout
      # corpus is run, and the deny->visibility contract is checked in BOTH
      # directions.
      #
      # In `smoke` rather than `host-only` for one reason: a boundary checked
      # only in a 15-minute non-blocking lane is a boundary that is not checked
      # on most merges. This one is deterministic and takes about a second.
      - name: Policy examples + arity + untrusted sources + visibility
        run: python -m evals.policy_examples

      # ------------------------------------------------------- PROMPT GATE --
      # P3b/W1-T5. "Prompts land as eval arms, never as edits", enforced.
      #
      # AHEAD measured this repository's own agent system prompt at -2.3pp for
      # PROSE ALONE, which makes an un-armed prompt edit the most expensive
      # kind of change in the project. `python -m evals.prompt_pin` AST-reads
      # the agent-facing constants in `harness/prompts.py`, digests each
      # constant's string VALUE (so a reformat or a docstring edit is not a
      # prompt change), and exits 2 when a digest moved with no isolating eval
      # arm covering it.
      #
      # In `smoke` rather than `host-only` for one reason: a convention does not
      # survive a deadline, and a gate that only ran in a 15-minute non-blocking
      # lane would be a gate most merges never meet. It costs well under a
      # second - one AST parse, no Docker, no network, no test collection.
      - name: "GATE: no unarmed agent-facing prompt edit"
        run: python -m evals.prompt_pin

      # ---------------------------------------------------- P3b/W2 GATES --
      # Three checks added when the prompt pin was attacked and the tools
      # ablation was actually run. All three are sub-second, host-only, and all
      # three were added because a measurement was WRONG and a pin was
      # decorative; each one is the mechanical form of a finding that prose
      # would not have stopped.
      #
      # `prompt_pin --json` is the same gate again, parsed for the two counters
      # that must stay visible: the exemption count against its pinned maximum,
      # and the coverage-gap count. Neither is a finding today - both are
      # findings the MOMENT they move, and a counter nobody reads decays
      # silently. The 7 coverage gaps are a real hole in the eval matrix and
      # this step is what keeps them named rather than quietly closed.
      - name: "GATE: prompt-pin exemption count and coverage gaps are published"
        run: python -c "import json,sys;d=json.loads(__import__('subprocess').run([sys.executable,'-m','evals.prompt_pin','--json'],capture_output=True,text=True).stdout);print('::notice title=prompt pin::exemptions=%s/%s coverage_gaps=%s'%(d['exemption_count'],d['max_exemptions'],d['coverage_gap_count']));sys.exit(0 if d['exemption_count']<=d['max_exemptions'] else 2)"

      # The go/no-go axis. This exists because the metric this phase calls the
      # go/no-go was STRUCTURALLY 0.0 and could not be moved by any setting of
      # any parameter: `measure_arm` resolved the needed tool unconditionally,
      # and `select:<name>` resolves any catalog tool by exact lookup. The gate
      # drives the metric to both ends and exits 2 if it cannot reach a non-zero
      # value, which is the "a metric that cannot fail is not a gate" rule made
      # executable. ~4 s, no Docker, no network, no provider.
      - name: "GATE: the discoverability go/no-go axis can actually fail"
        run: python -m evals.tools_ablation --go-no-go

      # The scorer audit. Two REGISTERED scorers disagreed on most of the
      # catalog, so the deferral token number is scorer-dependent; publishing
      # it without the scorer named is how a scorer artefact gets read as a
      # prompt-budget win.
      - name: "GATE: the registered scorers agree on something"
        run: python -m evals.tools_ablation --scorer-audit

      - name: P3b deferral seam, skills registry, tools ablation pins
        run: python -m pytest tests/test_p3b_tools_and_prompts.py -q -p no:randomly

  # --------------------------------------------------- export-redaction --
  # P5/W1-T5. Its OWN lane, and not a step inside another one.
  #
  # Every other boundary in this index protects the running system. This one
  # protects the COPY: an exported session is the one artifact whose whole
  # purpose is to leave the machine, so a leak here is the worst possible
  # leak -- and a secret that has been shared cannot be un-shared.
  #
  # The gate is the canary corpus (normal AND obfuscated) asserting that no
  # canary token survives redaction, plus the fail-closed export path: the
  # `shareable` predicate decides whether sharing is allowed at all, and the
  # receipt names what was withheld. 4.3 s, no Docker, no network, no
  # provider -- which is the only reason it can be BLOCKING at all.
  #
  # It is a separate job rather than a line in `smoke` so that when it goes
  # red, the name of the thing that went red is the name of the thing that
  # leaked.
  export-redaction:
    name: "export-redaction"
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
      NO_COLOR: "1"
      HARNESS_EXEC_SKIP_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: "GATE 1/7: known-failing pin registry"
        run: python -m tests.known_failing_pins

      - name: The lane index agrees with the workflows
        run: python -m evals.ci_lanes

      - name: Exported-session redaction (canary corpus, normal AND obfuscated)
        run: |
          python -m pytest -q -p no:randomly --no-header \
            tests/test_session_share.py

      # The shareable predicate is the GATE, not a field: a session that
      # fails it must not be shareable, and the user must be told what was
      # withheld rather than handed a file that silently lost content.
      - name: "GATE: no canary token survives redaction, in either corpus"
        run: python -m shared.session_share --selftest

  # --------------------------------------------------------- trust-ladder --
  # <5 min. The ten rungs, of which #8/#9/#10 are MEASURED here. Blocking.
  #
  # Rungs #8/#9/#10 assert budgets, so this is the one blocking lane that
  # carries timing. That is deliberate and it is why the budgets are written
  # the way they are: rung #9's cold-retrieval check asserts a BUDGET with the
  # machine named in its own failure text, and its warm/startup/frame checks
  # are compared as order-of-magnitude, never as a tight absolute threshold
  # that would fail on a slower runner. A p95 is only ever printed over a
  # window of at least 20 samples; below that the ladder downgrades the label
  # to "median" and withholds the percentile, because a p95 over 3 samples is
  # not a p95.
  trust-ladder:
    name: "trust-ladder"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
      NO_COLOR: "1"
      # The ladder is host-only by construction: every model call in it is a
      # scripted double, so no credential is read and no provider is contacted.
      HARNESS_EXEC_SKIP_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: "GATE 1/7: known-failing pin registry"
        run: python -m tests.known_failing_pins

      - name: The ten rungs
        run: python -m evals.run --suite trust-ladder

      - name: Upload the ladder report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trust-ladder-report
          path: logs/evals/**/trust_ladder_report.json
          if-no-files-found: warn
          retention-days: 14

  # ----------------------------------------------------------- host-only --
  # <15 min. No daemon, no network. NOT BLOCKING.
  #
  # This is where host-dependent timing lives. A red here is information, not
  # an obstruction: a timing assertion that fails on a contended runner is not
  # evidence of a regression, and putting one in a blocking lane is how a gate
  # learns to be ignored. `continue-on-error` is set deliberately and the
  # reason is above; the job still reports, and it still uploads its log.
  host-only:
    name: "host-only"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
      NO_COLOR: "1"
      HARNESS_EXEC_SKIP_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: "GATE 1/7: known-failing pin registry"
        run: python -m tests.known_failing_pins

      - name: Note the non-blocking status in the log
        run: |
          echo "::notice::this lane is NOT blocking. It holds the host-dependent"
          echo "::notice::timing assertions on purpose, so a slow or contended"
          echo "::notice::runner reports information rather than blocking a merge."

      - name: Docker-free, network-free regressions
        run: |
          python -m pytest -q -p no:randomly --no-header \
            tests/test_ceiling_r2_09_scale.py \
            tests/test_ceiling03_sessions.py \
            tests/test_slos.py \
            tests/test_tracing.py \
            tests/test_evidence_bundles.py \
            tests/test_security_regressions.py \
            tests/test_p3a_search_index.py \
            tests/test_p3a_snapshot.py \
            tests/test_p3a_inbox.py \
            tests/test_p3a_governance.py \
            tests/test_p3a_pipeline.py \
            tests/test_p3a_memory_ablation.py \
            tests/test_p3a_inbox_gate.py \
            tests/test_p3a_security_repins.py

      # P3a-W2. The inbox gate and the security re-pins are here rather than in
      # `smoke` for a reason worth stating: `smoke` is the lane people watch, so
      # anything added to it must be near-free AND cannot need a Docker daemon.
      # Both of these qualify (AST + tempfile + sqlite3; pure gate/store calls)
      # but they are wave-sized rather than mechanism-sized, so they stay in
      # `host-only` where a red is information instead of an obstruction.
      #
      # `tests/test_p3a_memory_quality.py` is deliberately ABSENT from every
      # lane's list. It drives the real loop, which is Docker work, and it is
      # better run deliberately (`python -m evals.memory_quality`) than absorbed
      # by a glob. A file that needs a daemon and is named in a Docker-free lane
      # is a lane that fails for a reason nobody wrote down.

      # P1/W2: the four terminals' MODULE-LOCAL pin modules, in one selection.
      #
      # They live inside their own package (`harness/test_*.py`,
      # `execution/test_*.py`, `runtime/test_*.py`), so `pytest tests/` NEVER
      # collects them -- a pin nobody runs is a comment with a filename. Only
      # the TIMING-bearing ones are here; the cheap deterministic ones are in
      # `smoke` and the cli-local ones are in `windows`, because putting a 3s
      # deterministic pin in a non-blocking lane is how a lane stops being read.
      #
      # WHY THIS LANE AND NOT A BLOCKING ONE, stated rather than assumed: every
      # module named below carries at least one wall-clock or p95 assertion.
      # `tests/test_ceiling03_sessions.py::test_five_thousand_indexed_sessions_
      # list_under_100ms_p95` is the canonical case -- it failed in this phase's
      # full-suite run and passed standalone, and its own diagnostic reported the
      # host 1.89x slowed. A flaky timing test in a BLOCKING lane trains people
      # to ignore the gate, which destroys the gate's value, so a red here is
      # INFORMATION and this lane is `continue-on-error`.
      #
      # The measured totals for this lane are in the G1 report
      # (`docs/release-verdict.md`), not in this file: a lane that publishes its
      # own green is a lane nobody can adjudicate.
      - name: "Module-local pins (T1/T2/T3/T4), timing-bearing"
        run: |
          python -m pytest -q -p no:randomly --no-header \
            harness/test_p1w1_performance.py \
            harness/test_p1w2_budgets.py \
            harness/test_p1w2_timing.py \
            execution/test_w1_latency_honesty_pins.py \
            execution/test_w2_latency_and_staleness_pins.py \
            execution/test_selection.py \
            runtime/test_latency_pins.py \
            runtime/test_w2_pins.py \
            runtime/test_structural_predictor_guard.py

  # --------------------------------------------------------------- docker --
  # ubuntu only. The real sandbox + verifier e2e. Blocking.
  #
  # A host with no Docker daemon is reported BLOCKED by the gate that needs
  # one, never pass. That is enforced inside the product
  # (`evals.gates.P0.docker_reachable` distinguishes a missing CLI from an
  # unreachable daemon for exactly this reason), and this lane's `docker info`
  # step is what tells the two apart in the log.
  docker:
    name: "docker"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: "GATE 1/7: known-failing pin registry"
        run: python -m tests.known_failing_pins

      - name: Daemon reachability (reported, never assumed)
        run: |
          docker info
          echo "::notice::a daemon failure here is a BLOCKED lane, not a pass."

      - name: Real sandbox and verifier e2e
        run: |
          python -m pytest -q -p no:randomly --no-header \
            tests/test_sandbox.py \
            tests/test_verify.py

  # -------------------------------------------------------------- windows --
  # The Docker-free CLI subset on windows-latest, including the `cli/`-local
  # modules. The lane itself lives in windows-dockerfree-ci.yml so that
  # file's enumerated-subset guard and its own history stay in one place; this
  # job is the labelled entry in the index, and it runs the registry gate
  # first so a promoted pin fails the Windows lane too.
  windows:
    name: "windows"
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
      NO_COLOR: "1"
      HARNESS_EXEC_SKIP_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install package + dev deps
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, "-m", "pip", "install", "--upgrade", "pip"], check=True)
          subprocess.run([sys.executable, "-m", "pip", "install", "-e", ".[dev]"], check=True)

      - name: "GATE 1/7: known-failing pin registry"
        shell: python
        run: |
          import subprocess, sys
          sys.exit(subprocess.run([sys.executable, "-m", "tests.known_failing_pins"]).returncode)

      - name: The lane index agrees with the workflows
        shell: python
        run: |
          import subprocess, sys
          sys.exit(subprocess.run([sys.executable, "-m", "evals.ci_lanes"]).returncode)

      - name: The cli/-local modules T4 added, Docker-free
        shell: python
        run: |
          import subprocess, sys
          target = [
              "cli/test_cli_import_smoke.py",
              "cli/test_display_contract.py",
              "cli/test_render_path_pin.py",
              "cli/test_sanitize_pipeline.py",
              "cli/test_sanitize_shapes.py",
              "tests/test_import_smoke.py",
          ]
          code = subprocess.run(
              [sys.executable, "-m", "pytest", "-q", "--no-header",
               "-p", "no:randomly", *target],
          ).returncode
          sys.exit(code)

  # ------------------------------------------------------------- nightly --
  # The full 8-arm matrix plus the full suite. Scheduled + manual only; it
  # needs real credentials and real spend, so it is never a required PR
  # check. `evals/ci_truth.py::manual_checks_are_manual` enforces that
  # separately, and this lane is deliberately not on the PR path at all.
  nightly:
    name: "nightly"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: "GATE 1/7: known-failing pin registry"
        run: python -m tests.known_failing_pins

      - name: Daemon reachability
        run: docker info

      - name: The full 8-arm prompt matrix
        run: python -m evals.run --suite prompt-regression --json

      - name: The full tests/ suite
        run: python -m pytest tests/ -q -p no:randomly --no-header
