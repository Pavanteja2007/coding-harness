[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name on PyPI. The installed COMMAND is `neo` (see
# [project.scripts] below), the same way beautifulsoup4 on PyPI installs as
# bs4. The distribution carries a `-harness` suffix so the project name on
# the index is unambiguous: a bare agent name is a contested namespace and
# `neo-agent-cli` states what it is without needing the command name to be
# unique too.
name = "neo-agent-cli"
# 0.3.0, not 0.2.1: the unpublished 0.2.1 candidate was superseded before it
# ever reached PyPI, and the tree it would have shipped now contains a
# BREAKING default switch (an unqualified agent run resolves to the `daily`
# engine instead of `legacy_agent` -- see CHANGELOG.md). Publishing that as a
# patch increment would tell an existing user "nothing changed" when the
# default engine, the trace event kinds, and the on-disk artifacts all did.
# 0.2.0 remains the last public release; see docs/release-evidence.md.
version = "0.3.0"
description = "Neo — AI coding agent harness with adaptive runtime and persistent memory"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.13"
authors = [
    { name = "Pavanteja2007" },
]
keywords = [
    "ai", "agent", "coding-agent", "bug-fixing", "harness",
    "llm", "mcp", "tree-sitter", "sandbox", "docker",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Bug Tracking",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    # JS/TS grammars for the multi-language code graph + syntax checks
    # (memory/code_graph indexes .js/.jsx/.mjs/.cjs/.ts/.tsx with these;
    # harness.lint.check_syntax and editor.syntax_check use the same
    # parsers). Missing grammars degrade to "no finding" (documented
    # false-negative bias), but a declared dep makes a clean install work.
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "mcp>=2.0,<3",
    "litellm==1.74.9",
    "packaging>=23.0",
    "rich>=13.0",
    # syntax highlighting under the diff colors (cli/ui.py's
    # language-aware diff renderer + the TUI inline preview; degrades
    # to flat +/- roles without it, but a clean install must have it)
    "pygments>=2.13",
    # TOML settings on Python 3.10 (3.11+ ships tomllib in stdlib;
    # without this the config chain silently ignores every file)
    "tomli>=2.0; python_version < '3.11'",
    # full-screen interactive shell (same team as rich; replaces the
    # rich-print REPL for `neo` with no args — see cli/tui.py)
    "textual>=0.40",
    "platformdirs>=3.0",
]

[project.urls]
Homepage = "https://github.com/Pavanteja2007/coding-harness"
Repository = "https://github.com/Pavanteja2007/coding-harness"
Issues = "https://github.com/Pavanteja2007/coding-harness/issues"
Changelog = "https://github.com/Pavanteja2007/coding-harness/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "ruff==0.16.6",
]
release = [
    "build==1.6.1",
    "cyclonedx-bom==7.4.0",
    "twine==7.0.0",
    "uv==0.11.14",
]

[project.scripts]
neo = "cli.main:main"
# Legacy aliases, kept so an existing install keeps working for one
# release. `vex` is the previous product name; `harness` predates it. Both
# resolve to the same entry point and are removed together in a dedicated
# migration commit once every terminal's docs reference `neo`.
vex = "cli.main:main"
harness = "cli.main:main"

[tool.setuptools]
include-package-data = false
# Explicit package list: the repo root is a multi-module workspace
# (cli, harness, runtime, memory, execution, evals, mcp_server, dashboard,
# shared) — automatic flat-layout discovery refuses to guess between
# them (and would sweep logs/ and demo/ in).
packages = [
    "cli",
    "cli._stubs",
    "harness",
    "harness._stubs",
    "harness.agent_kernel",
    "runtime",
    "memory",
    "execution",
    "evals",
    "mcp_server",
    "dashboard",
    "shared",
    "acp",
    "agent_sdk",
    "extensions",
    "integrations",
    "recipes",
    "recipes.builtin",
]

[tool.setuptools.package-data]
# Non-Python files the installed `neo` reads at runtime:
# cli/fixtures/smoke_repo powers `neo run-benchmark --subset smoke`
# (without it a pip-installed neo fails the smoke subset with
# "smoke fixture repo missing"). Verified in the wheel/sdist after
# every `python -m build`.
cli = [
    "fixtures/**/*.json",
    "fixtures/**/*.md",
    "fixtures/**/*.py",
    "fixtures/**/*.toml",
    "fixtures/**/*.txt",
    "fixtures/**/*.yaml",
    "fixtures/**/*.yml",
]
recipes = [
    "builtin/*.yaml",
]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.py[cod]"]

[tool.pytest.ini_options]
    # T5.W2.2 -- the collection surface was LYING about coverage.
    #
    # `testpaths = ["tests"]` meant `python -m pytest` collected 7169 tests
    # and MISSED every module-local `test_*.py` inside a production package.
    # Measured 2026-10-01: 24 such modules, ~410 tests, including the whole
    # known-gap registries (execution/test_unsandboxed_pins.py,
    # harness/test_egress_call_sites.py, harness/test_gap_audit.py,
    # runtime/test_*_pins.py, cli/test_render_path_pin.py). Those are the
    # pins that record gaps, so the one suite nobody but T5 runs was the one
    # suite that could not see them.
    #
    # `tests/` stays first so the default invocation reads the same way, and
    # the module roots are listed EXPLICITLY rather than as `.` so a new
    # top-level directory is a deliberate decision instead of silently
    # entering the default suite.
    testpaths = [
        "tests",
        "harness",
        "execution",
        "runtime",
        "cli",
        "mcp_server",
        "memory",
        "shared",
        "evals",
        "scripts",
        "dashboard",
        "demo",
    ]
    # Fixture repos are TEST DATA with deliberate bugs (cli/fixtures/smoke_repo
    # is driven by `neo run-benchmark --subset smoke`); collecting their
    # tests would report the fixture's planted bug as a product failure.
    # demo/demo-work is a regenerated run artifact tree.
    norecursedirs = [
        "*.egg",
        ".*",
        "_darcs",
        "build",
        "CVS",
        "dist",
        "fixtures",
        "demo-work",
        "node_modules",
        "venv",
        "{arch}",
        "logs",
        "graphify-out",
        "probe_logs",
        "recipes",
        "repo",
    ]
    # T5.W2.2 -- these are PRODUCTION modules whose names collide with
    # pytest's `test_*.py` discovery pattern. They are NOT suppressed tests
    # and they are NOT failures: pytest is being asked to import them as test
    # modules, which is simply the wrong thing to do. Each was found by an AST
    # scan for "does PRODUCTION code import this module?", not by eyeballing:
    #
    #   execution/test_selection.py  3 production importers
    #       evals/daily_driver.py, execution/verification_intelligence.py,
    #       execution/verify.py            (T2's own finding 8.6)
    #   harness/test_config.py       2 production importers
    #       execution/ecosystems.py, harness/editor.py
    #
    # harness/test_config.py is the larger of the two: 1,164 lines exporting
    # `resolve_effective_test_config`, `diff_effective_test_config`,
    # `classify_test_config_path`, `register_language_surfaces`, and two
    # FUNCTIONS LITERALLY NAMED `test_config_patterns` / `test_config_guard`.
    # Collected as a suite it yields 1 no-op test (it RETURNS a list instead of
    # asserting) plus 1 hard error (`fixture 'pristine_dir' not found`) --
    # i.e. zero assertions and one error, from a module that is really the
    # edit-gate's configuration resolver.
    #
    # If you add a third: rename the module, do not add it here. This list is
    # a migration aid, not a place to park production code.
    addopts = "--ignore=execution/test_selection.py --ignore=harness/test_config.py"
    markers = [
        # Real-process proofs: `neo serve` / `neo acp` bind sockets and run the
        # real engine, so they are slower than the in-process suites. Select
        # them with `-m slow`; they are never part of a fast inner loop.
        "slow: real subprocess/server protocol proofs",
    ]

# ---------------------------------------------------------------------------
# Ruff — Neo's ONE linter/formatter config (root-level dev tooling).
#
# This is the canonical lint/format surface for the whole repo:
# - `ruff check` + `ruff format` run on every commit (scripts/hooks/pre-commit)
# - the same config runs in CI
# - if an execution-layer lint TOOL is ever added for the agent's in-sandbox
#   use, it must reuse THIS config rather than introducing a second one
#
# Style philosophy: this codebase predates the linter (25k lines, 4 parallel
# build terminals), so the config enforces high-signal correctness rules and
# formatting, NOT stylistic rewrites. Checks are additive: run
# `ruff check --statistics` before widening any selection.
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py310"
extend-exclude = [
    "logs",             # gitignored run artifacts (state.json, traces, archives)
    "graphify-out",     # generated knowledge-graph output
    "demo/demo-work",   # regenerated per demo run (gitignored)
    ".harness",         # memory layer runtime state
    "probe_logs",       # scratch probe outputs from live verification rounds
    "Temp",             # scratch drivers/venvs/artifacts under Temp/opencode
    ".opencode",        # local AI-tooling config, not project code
    ".qwen",            # ditto
    "neo.egg-info",
    # Fixture repos are TEST DATA, not project code: each contains a
    # DELIBERATE bug (bug04's F821 undefined name IS the bug the agent
    # must fix). Linting them would flag the point of the fixture.
    "tests/fixtures",
    "cli/fixtures",
]

[tool.ruff.lint]
# E/W   pycodestyle errors/warnings
# F     pyflakes — real bugs: undefined names, unused imports, shadowing
# I     import sorting/consistency (matches the repo's existing style)
# B     flake8-bugbear — likely-bug patterns (minus opt-outs below)
# SIM   flake8-simplify (minus opt-outs below)
# RUF   ruff-specific (incl. RUF100 unused-noqa)
#
# Deliberately NOT selected (stylistic churn on a 25k-line codebase
# written before the linter): UP (pyupgrade — the repo targets 3.10+
# already and `Optional[X]` is the house style), C4 (C408 dict() calls
# are the documented style), BLE (blind-except is a deliberate,
# documented pattern here: "never let cleanup/monitoring raise"),
# FURB, PIE, ISC, PL* (complexity opinions).
#
# Migration: pre-linter debt in EXISTING files is exempted via
# scripts/lint-baseline.txt (a ratchet — see CONTRIBUTING.md "Lint &
# format"). NEW files and newly-cleaned files must pass in full.
select = ["E", "W", "F", "I", "B", "SIM", "RUF"]
ignore = [
    "E501",   # line length is enforced by the formatter (100 col) — long
              # string literals in prompts/tests are left alone on purpose
    "E741",   # `l` as a loop variable is established house style (14 uses
              # in the e2e suite alone) — pure churn to rewrite
    "RUF001", # the CLI theme/glyph constants deliberately use
    "RUF002", # typographic characters (› ● ✔ with ASCII fallbacks) —
              # flagging them as "ambiguous" misses the point
    "SIM108", # ternary-vs-if-else churn
    "SIM105", # contextlib.suppress churn
    "SIM117", # nested-with collapse churn (readability preference)
    "B017",   # pytest.raises(Exception) asserts-by-assertion is used in tests
]

[tool.ruff.lint.isort]
known-first-party = [
    "cli",
    "harness",
    "runtime",
    "memory",
    "execution",
    "evals",
    "mcp_server",
    "dashboard",
    "shared",
]

[tool.ruff.format]
# 100 columns matches the dominant existing line length (the harness module
# was written at ~100); 88 (black default) would rewrap ~160 prompt-heavy
# lines for zero gain.
line-ending = "auto"
