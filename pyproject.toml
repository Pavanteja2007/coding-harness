[project]
name = "coding-harness"
version = "0.1.0"
description = "AI coding agent harness with adaptive runtime and persistent memory"
requires-python = ">=3.10"
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "mcp>=1.2",
    "litellm==1.74.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
harness = "cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
